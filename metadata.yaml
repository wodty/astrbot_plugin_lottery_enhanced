name: astrbot_plugin_lottery_enhanced
display_name: 抽奖插件增强版
short_desc: 动态奖品类目、等级限制、满人/定时自动开奖、批量抽奖
desc: |
  抽奖插件增强版，支持动态添加/删除奖品类目、群等级/身份限制、满人自动开奖、定时自动开奖、批量抽奖。
  开启时清空重置，需先添加奖品才能参与，参与有实时反馈，可查询奖品/时间/人数/参加名单。
author: wodty
repo: https://github.com/wodty/astrbot_plugin_lottery_enhanced
astrbot_version: ">=4.17.0"
support_platforms:
  - aiocqhttp
  - qq_official
tags:
  - 抽奖
  - 群管
version: v2.3.0
help: |
  【抽奖插件 v2.3 命令列表】

  管理员命令：
  - 开启抽奖 [人数X] [时间YYYY-MM-DD HH:MM]：开启抽奖（清空所有内容，需先添加奖品才能参与）
  - 添加奖品 奖项名称 奖品名称 数量：添加新的奖品类目（示例：添加奖品 三等奖 钥匙扣 10）
  - 删除奖品 奖项名称：删除奖品类目（示例：删除奖品 三等奖）
  - 设置奖品 奖项名称 奖品名称 数量：修改已有类目的奖品名称和数量（示例：设置奖品 一等奖 iPhone15 2）
  - 设置等级 X/管理员/群主/取消：设置参与等级要求
  - 开奖：手动开奖
  - 关闭抽奖：关闭抽奖活动
  - 重置抽奖：重置抽奖活动
  - 抽奖配置：查看所有抽奖插件配置信息

  用户命令：
  - 参加抽奖：参加当前抽奖（需管理员先添加奖品）
  - 抽奖状态：查看抽奖状态
  - 抽奖详情：查看奖品、时间、人数、参加名单
  - 中奖名单：查看中奖名单
